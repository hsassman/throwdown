# Fly.io config for the matchmaking server. Deploy from the server/ folder:
#   fly deploy
# Change `app` to the name you create with `fly apps create`.
app = "throwdown-server"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  Telemetry__Console = "true"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine running: matchmaking state lives in memory, and SignalR
  # connections drop if a machine is stopped or a second one takes traffic.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
